<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>memo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--deep:#8E5DB5;--pale:#EFE3F6;--plum:#3B2A47;--muted:#7A6A86;--lemon:#FDFDC9;--lemonB:#E3DF96;--wine:#7A2448;--khaki:#C4D3A0;--khakiT:#4F6128;--cameo:#EBBAC8;--m:16px;
--band:#C69FD5;--on:#FDFDC9;--off:#6E4A8C;--bgA:#F3E9F8;--bgB:#FDFDC9;--bgC:#F7E1E8}
body[data-tab=lists]{--band:#EEEBCB;--on:#8E5DB5;--off:#8A8255;--bgA:#FDFDC9;--bgB:#F3E9F8;--bgC:#FDFDC9}
body[data-tab=verbs]{--band:#DFA6B7;--on:#4F6128;--off:#6E3A4E;--bgA:#F7E1E8;--bgB:#FDFDC9;--bgC:#F3E9F8}
body[data-tab=stats]{--band:#F6E2D8;--on:#8E5DB5;--off:#D2B8AC;--bgA:#FFF0E9;--bgB:#F3E9F8;--bgC:#FDFDC9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;color:var(--plum);overflow:hidden}
body{background:radial-gradient(circle at 12% 8%,var(--bgA) 0,transparent 55%),radial-gradient(circle at 92% 92%,var(--bgC) 0,transparent 55%),var(--bgB);transition:background .3s}
#app{height:var(--tg-viewport-height,100%);display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) var(--m) 16px;-webkit-overflow-scrolling:touch}
h1{font-size:34px;line-height:1.1;color:var(--deep);margin:8px 0 4px;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 12px;font-size:16px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.55));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1.5px solid rgba(255,255,255,.95);border-radius:24px;padding:14px 18px;margin-bottom:10px;box-shadow:0 6px 22px rgba(142,93,181,.13),inset 0 1px 0 #fff}
.card.sel{background:linear-gradient(145deg,rgba(253,253,201,.95),rgba(253,253,201,.7))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.row b{font-size:18px}.row small{display:block;color:var(--muted);margin-top:3px;font-size:14px}
.chev{color:var(--deep);font-size:24px}
.lock{opacity:.5;pointer-events:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--pale);color:var(--deep);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-right:12px}
.num.done{background:var(--khaki);color:var(--khakiT)}
.btnbar{display:flex;gap:10px;padding:10px var(--m) 14px}
button{font:inherit;border:0;border-radius:999px;padding:15px 14px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.45}
.primary{flex:1;background:linear-gradient(180deg,#9A6AC0,#8456AB);color:#fff;box-shadow:0 6px 16px rgba(142,93,181,.35)}
.lemon{flex:1;background:var(--lemon);color:var(--plum);border:2px solid var(--lemonB);box-shadow:0 6px 16px rgba(227,223,150,.5)}
.soft{background:#DCC4EA;color:#5A3A75}
.good{flex:1;background:var(--khaki);color:var(--khakiT)}
.bad{flex:1;background:var(--cameo);color:var(--wine)}
.khaki{flex:1;background:#698039;color:#fff}
nav{display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);background:var(--band);transition:background .3s}
nav button{background:none;padding:8px 22px;color:var(--off);box-shadow:none;border-radius:16px}
nav button.on{color:var(--on)}
nav svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.hero{display:block;width:78%;max-width:300px;margin:6px auto 0;transform:rotate(-5deg);filter:drop-shadow(0 14px 18px rgba(142,93,181,.22))}
.homewrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:20px}
.homewrap h1{font-size:42px;margin:0}.homewrap .hero{width:84%;max-width:340px;margin:18px auto 8px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-8px)}}
.word{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.word .es{font-size:19px;font-weight:600}.word small{color:var(--muted);display:block;margin-top:2px}
.el{color:#4B7DB5}.la{color:#C9608A}
.pill{min-width:36px;text-align:center;border-radius:12px;padding:5px 9px;font-weight:800;background:var(--pale);color:#6E4A8C;flex:none}
.pill.z{background:var(--cameo);color:var(--wine)}.pill.hi{background:#C69FD5;color:#fff}
input[type=search]{width:100%;border:0;border-radius:999px;padding:14px 20px;font-size:17px;background:rgba(255,255,255,.85);margin-bottom:12px;box-shadow:0 4px 14px rgba(142,93,181,.1)}
.flash{position:relative;margin-top:60px;min-height:300px;height:46vh;max-height:420px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:34px;background:linear-gradient(160deg,#fff,#FBF6FD);box-shadow:0 14px 34px rgba(142,93,181,.22);touch-action:pan-y;padding:0 16px;flex-direction:column}
.flash .cap{position:absolute;top:50px;left:0;right:0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.3px}
.flash .big{font-size:38px;font-weight:800;letter-spacing:-.5px;color:var(--deep)}.flash .big.dark{color:var(--plum)}
.flash .en{font-size:27px;color:var(--plum);margin-top:6px}
.flash hr{width:50%;border:0;border-top:2px solid #EFE3F6;margin:16px 0}
.flash .hint{position:absolute;bottom:14px;left:0;right:0;color:var(--muted);font-size:13px}
.peek{position:absolute;top:-62px;left:50%;width:150px;transform:translateX(-50%) rotate(-4deg)}
.prog{color:var(--muted);text-align:right;margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center}
.x{background:none;color:var(--deep);padding:4px 8px;font-size:22px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.7);overflow:hidden;margin:6px 0 0}.bar i{display:block;height:100%;background:var(--deep);border-radius:8px;transition:width .3s}
.bar.t i{background:var(--cameo);transition:width 1s linear}
.back{color:var(--deep);font-size:18px;cursor:pointer;margin-bottom:4px;display:inline-block;font-weight:600}
.center{text-align:center}
.seg{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.55);padding:4px;border-radius:999px}.seg button{flex:1;padding:11px 6px;font-size:15px;background:none;color:var(--deep)}.seg button.on{background:var(--deep);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chips button{padding:10px 14px;font-size:15px;background:#fff;color:var(--deep);border:2px solid #DCC4EA}.chips button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
input.f{width:100%;border:2px solid #DCC4EA;border-radius:20px;padding:15px 18px;font-size:19px;margin-top:14px;background:#fff}
.fb{font-weight:800;font-size:20px;margin-top:10px}.ok{color:var(--khakiT)}.no{color:var(--wine)}.meh{color:#9A7B00}
table{width:100%;border-collapse:collapse;font-size:17px}td{padding:6px 4px}td:first-child{color:var(--muted);font-size:14px;width:42%}
td b.irr{color:#C9608A}
.rule{white-space:pre-line;line-height:1.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tile{position:relative;overflow:hidden;border-radius:24px;padding:12px 14px;min-height:92px;background:rgba(255,255,255,.7);border:1.5px solid #fff;box-shadow:0 6px 22px rgba(142,93,181,.12)}
.tile span{color:var(--muted);font-size:13px;font-weight:600}.tile b{display:block;font-size:24px;margin-top:2px}.tile img{position:absolute;right:-12px;bottom:-8px;width:76px}
.chart{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:8px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:4px}.chart i{display:block;width:100%;border-radius:6px;background:var(--khaki);min-height:3px}.chart .cur i{background:#698039}
.segbar{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px;margin:8px 0}.segbar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--pale);color:#6E4A8C;border-radius:10px;padding:2px 9px;font-size:13px;font-weight:700;margin-left:8px}
.warn{color:#9A7B00;font-size:13px;font-weight:700}
.switch{width:52px;height:30px;border-radius:30px;background:#DCC4EA;position:relative;flex:none;transition:.2s}.switch.on{background:var(--deep)}.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.switch.on::after{left:25px}
.optbtn{display:block;width:100%;background:#fff;border:2px solid #DCC4EA;color:var(--plum);margin-bottom:10px;padding:18px}
.optbtn.right{background:var(--khaki);border-color:#698039}.optbtn.wrong{background:var(--cameo);border-color:var(--wine)}
.undo{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:5;white-space:nowrap}
#sheet{position:fixed;top:0;left:0;right:0;height:var(--tg-viewport-height,100%);background:rgba(59,42,71,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
#sheet .box{width:100%;max-width:520px;max-height:92%;overflow:auto;background:linear-gradient(160deg,#fff,#F8F0FB);border-radius:30px 30px 0 0;padding:20px var(--m) calc(env(safe-area-inset-bottom) + 18px)}
#sheet h2{margin:0 0 6px;color:var(--deep);font-size:24px}
#sheet textarea{width:100%;min-height:170px;border:2px solid #DCC4EA;border-radius:18px;padding:14px;font:inherit;font-size:16px;background:#fff;margin:8px 0;resize:vertical}
#sheet input[type=text]{width:100%;border:2px solid #DCC4EA;border-radius:18px;padding:13px 16px;font:inherit;font-size:17px;background:#fff;margin-bottom:8px}
#sheet select{width:100%;border:2px solid #DCC4EA;border-radius:18px;padding:13px 16px;font:inherit;font-size:17px;background:#fff;margin-bottom:8px}
#sheet .acts{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}#sheet .acts button{padding:15px 12px;font-size:16px;flex:1}
.hintx{color:var(--muted);font-size:14px;margin:2px 0 4px}.linkbtn{background:none;color:var(--wine);font-size:15px;padding:12px;display:block;margin:6px auto 0;font-weight:600}
.pillrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.pillrow button{padding:8px 14px;font-size:14px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ---- Telegram dark theme ---- */
body.dark{--plum:#F3ECF8;--muted:#B9AAC7;--pale:#3B2E4C;--deep:#C9A6DE;--lemon:#4D4A22;--lemonB:#6B6730;--khakiT:#D3E3AE;--khaki:#4C5C2E;--cameo:#6A3447;--wine:#FFC4D6;--bgA:#2B2040;--bgB:#191321;--bgC:#2A1C2C;--band:#2A2040;--on:#FDFDC9;--off:#9C88B8}
body.dark[data-tab=lists]{--band:#2A281C;--on:#C9A6DE;--off:#948D5E;--bgA:#2C2A1A;--bgB:#1C1626;--bgC:#2C2A1A}
body.dark[data-tab=verbs]{--band:#3A2230;--on:#D3E3AE;--off:#C88AA3;--bgA:#3A2230;--bgB:#1D1A15;--bgC:#241A33}
body.dark[data-tab=stats]{--band:#33262A;--on:#C9A6DE;--off:#9C7F78;--bgA:#33262A;--bgB:#221A31;--bgC:#2A281C}
body.dark .card,body.dark .tile{background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border-color:rgba(255,255,255,.12);box-shadow:0 6px 22px rgba(0,0,0,.35)}
body.dark .card.sel{background:linear-gradient(145deg,rgba(253,253,201,.2),rgba(253,253,201,.08))}
body.dark .flash{background:linear-gradient(160deg,#2E2342,#241A34);box-shadow:0 14px 34px rgba(0,0,0,.45)}
body.dark .flash hr{border-top-color:#3B2E4C}
body.dark .seg{background:rgba(255,255,255,.08)}body.dark .seg button.on,body.dark .chips button.on{background:#8E5DB5;color:#fff}
body.dark .chips button,body.dark .optbtn{background:#2A2038;border-color:#4A3A60;color:var(--plum)}
body.dark input.f,body.dark input[type=search],body.dark #sheet input[type=text],body.dark #sheet textarea,body.dark #sheet select{background:#2A2038;color:var(--plum);border-color:#4A3A60}
body.dark #sheet .box{background:linear-gradient(160deg,#2A2038,#20182E)}
body.dark .soft{background:#4A3A60;color:#F3ECF8}body.dark .bar{background:rgba(255,255,255,.12)}
body.dark .tag{background:#3B2E4C;color:#E6D5F2}body.dark .tag[style]{background:#2A2038!important}
body.dark .lemon{background:#FDFDC9;color:#3B2A47;border-color:#E3DF96;box-shadow:0 6px 18px rgba(253,253,201,.12)}body.dark .primary{background:linear-gradient(180deg,#A877CB,#8E5DB5)}body.dark .undo{background:#F3ECF8;color:#2A2038}
.card.row:active,.card.word:active{transform:scale(.985);transition:transform .08s}

/* ---- Telegram look: uses the person's own Telegram theme colours ---- */
body.tgs{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#efeff4);--sec:var(--tg-theme-section-bg-color,var(--bg));--txt:var(--tg-theme-text-color,#000);--hint:var(--tg-theme-hint-color,#8e8e93);--link:var(--tg-theme-link-color,#3390ec);--btn:var(--tg-theme-button-color,#3390ec);--btnt:var(--tg-theme-button-text-color,#fff);--sep:color-mix(in srgb,var(--hint) 25%,transparent);--tint:color-mix(in srgb,var(--btn) 14%,transparent);
 --plum:var(--txt);--muted:var(--hint);--deep:var(--link);--pale:color-mix(in srgb,var(--btn) 14%,transparent);--band:var(--tg-theme-bottom-bar-bg-color,var(--bg));--on:var(--btn);--off:var(--hint);--bgA:var(--bg2);--bgB:var(--bg2);--bgC:var(--bg2);--lemon:var(--tint);--lemonB:transparent;--khaki:color-mix(in srgb,#34c759 22%,transparent);--khakiT:#2f9e4f;--cameo:color-mix(in srgb,#ff3b30 18%,transparent);--wine:#e5392f;color:var(--txt);background:var(--bg2)}
body.tgs[data-tab]{--band:var(--tg-theme-bottom-bar-bg-color,var(--bg));--on:var(--btn);--off:var(--hint);--bgA:var(--bg2);--bgB:var(--bg2);--bgC:var(--bg2)}
body.tgs h1{color:var(--txt);font-size:30px;letter-spacing:-.3px}
body.tgs .sub{color:var(--hint)}
body.tgs .card,body.tgs .tile{background:var(--sec);border:0;border-radius:12px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.tgs .card.sel{background:var(--tint)}
body.tgs .row small,body.tgs .word small,body.tgs td:first-child{color:var(--hint)}
body.tgs .chev{color:var(--hint);font-size:22px}
body.tgs .num{background:var(--tint);color:var(--btn)}body.tgs .num.done{background:var(--khaki);color:var(--khakiT)}
body.tgs button{border-radius:12px;box-shadow:none}
body.tgs .primary,body.tgs .lemon,body.tgs .khaki{background:var(--btn);color:var(--btnt);border:0;box-shadow:none}
body.tgs .soft{background:var(--tint);color:var(--link)}
body.tgs .good{background:var(--khaki);color:var(--khakiT)}body.tgs .bad{background:var(--cameo);color:var(--wine)}
body.tgs .x{background:none;color:var(--link)}
body.tgs nav{background:var(--band);border-top:1px solid var(--sep)}
body.tgs nav button{color:var(--off)}body.tgs nav button.on{color:var(--on)}
body.tgs .btnbar{background:transparent}
body.tgs .seg{background:var(--tint);border-radius:10px;padding:3px}body.tgs .seg button{border-radius:8px;color:var(--txt)}body.tgs .seg button.on{background:var(--sec);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
body.tgs .chips button,body.tgs .optbtn{background:var(--sec);border:1px solid var(--sep);color:var(--txt);border-radius:12px}body.tgs .chips button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
body.tgs .optbtn.right{background:var(--khaki);border-color:#34c759}body.tgs .optbtn.wrong{background:var(--cameo);border-color:#ff3b30}
body.tgs .flash{background:var(--sec);box-shadow:none;border-radius:20px}body.tgs .flash .big{color:var(--link)}body.tgs .flash .big.dark{color:var(--txt)}body.tgs .flash .en{color:var(--txt)}body.tgs .flash hr{border-top-color:var(--sep)}
body.tgs input.f,body.tgs input[type=search],body.tgs #sheet input[type=text],body.tgs #sheet textarea,body.tgs #sheet select{background:var(--sec);color:var(--txt);border:1px solid var(--sep);border-radius:12px}
body.tgs input[type=search]{box-shadow:none}
body.tgs #sheet .box{background:var(--bg);border-radius:16px 16px 0 0}body.tgs #sheet h2{color:var(--txt)}
body.tgs .bar{background:var(--sep);height:6px}body.tgs .bar i{background:var(--btn)}
body.tgs .pill{background:var(--tint);color:var(--link)}body.tgs .pill.z{background:var(--cameo);color:var(--wine)}body.tgs .pill.hi{background:var(--btn);color:var(--btnt)}
body.tgs .tag{background:var(--tint);color:var(--link)}body.tgs .tag[style]{background:var(--bg2)!important}
body.tgs .switch{background:var(--sep)}body.tgs .switch.on{background:#34c759}
body.tgs .back{color:var(--link)}body.tgs .linkbtn{color:#e5392f}body.tgs .undo{background:var(--txt);color:var(--bg)}
body.tgs .tile span{color:var(--hint)}body.tgs .chart .cur i{background:var(--btn)}body.tgs .chart i{background:color-mix(in srgb,var(--btn) 45%,transparent)}
body.tgs .hero{filter:none}
body.tgs .prog{color:var(--hint)}

/* ---- stronger buttons (all looks, light and dark) ---- */
body.tgs .soft{background:color-mix(in srgb,var(--btn) 20%,var(--sec));color:var(--link);border:1.5px solid color-mix(in srgb,var(--btn) 50%,transparent)}
body.tgs .good{border:1.5px solid color-mix(in srgb,#34c759 55%,transparent)}body.tgs .bad{border:1.5px solid color-mix(in srgb,#ff3b30 50%,transparent)}

body.isdark.tgs .chips button,body.isdark.tgs .optbtn{border-color:color-mix(in srgb,#fff 38%,transparent);color:#fff}

body.isdark.tgs .pill{background:color-mix(in srgb,var(--btn) 35%,transparent);color:#fff}
body.isdark.tgs .linkbtn{color:#ff8c84}body.isdark.tgs .chev{color:#b9b9c2}
body.dark .soft{background:#6B5590;color:#fff;border:1.5px solid #9A82C4}body.dark .bad{background:#7a2c4a;color:#ffd9e6;border:1.5px solid #c4607f}body.dark .good{background:#46622b;color:#e8f8cf;border:1.5px solid #86aa4c}
body.dark .seg button{color:#fff;opacity:.85}body.dark .seg button.on{opacity:1}body.dark nav button{color:#BBA8D6}body.dark nav button.on{color:#FDFDC9}
body.dark .chips button,body.dark .optbtn{border-color:#8A74B0;color:#fff}body.dark .x{color:#E6D5F2}
body.tgs .cell,.cell{width:100%}
/* ---- keyboard open: give the typing box room ---- */
body.kb nav{display:none}
body.kb main{padding-bottom:8px}

body.kb .flash .hint{display:none}body.kb .flash .big{font-size:30px}body.kb .flash .en{font-size:22px}
body.kb .peek{width:112px;top:-48px}
body.kb input.f{margin-top:10px}

<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { try { tg.ready(); tg.expand(); } catch {} }
const $ = s => document.querySelector(s);
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const buzz = ok => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(ok ? 'success' : 'warning'); } catch {} };
const tap = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch {} };

/* =================== DATA =================== */
const fresh = () => ({ v: 2, t: 0, words: {}, lists: [], orphans: [], days: {}, vstat: {}, vpass: [], vbest: {}, myverbs: [], ex: false,
  set: { lang: null, name: '', size: 20, kinds: ['es','en','type'], checkArt: true, chosen: [] } });
let D = fresh();
const cloud = (() => { try { return tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.platform !== 'unknown' ? tg.CloudStorage : null; } catch { return null; } })();
const CHUNK = 3500; const sent = {}; let saveTimer = null;
function persistLocal() { try { localStorage.setItem('memo.data', JSON.stringify(D)); } catch {} }
function save() { D.t = Date.now(); persistLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 700); }
function pushCloud() {

    const j = JSON.stringify(D), n = Math.max(1, Math.ceil(j.length / CHUNK));
    for (let i = 0; i < n; i++) { const part = j.slice(i * CHUNK, (i + 1) * CHUNK), k = 'data_' + i; if (sent[k] !== part) { cloud.setItem(k, part); sent[k] = part; } }
    if (sent.data_n !== String(n)) { cloud.setItem('data_n', String(n)); sent.data_n = String(n); }
  } catch {}
}
function loadLocal() {
  try { const j = localStorage.getItem('memo.data'); if (j) { D = Object.assign(fresh(), JSON.parse(j)); D.set = Object.assign(fresh().set, D.set); return true; } } catch {}
  return false;
}
function loadCloud(done) {
  if (!cloud) return done();
  try {
    cloud.getItem('data_n', (e, n) => {
      n = +n; if (e || !n) return done();

      cloud.getItems(keys, (e2, parts) => {
        try { if (!e2 && parts) { const s = keys.map(k => parts[k] || '').join(''), c = JSON.parse(s); keys.forEach(k => sent[k] = parts[k]); sent.data_n = String(n); if ((c.t || 0) > (D.t || 0)) { D = Object.assign(fresh(), c); D.set = Object.assign(fresh().set, D.set); persistLocal(); } } } catch {}
        done();
      });

}
function migrateOld() {
  try {
    const g = k => { const v = localStorage.getItem('memo.' + k); return v == null ? null : JSON.parse(v); };
    const lang = g('lang'); if (lang) D.set.lang = lang;
    const vp = g('vpass'); if (vp) D.vpass = vp;
    const old = g('ratings') || {}, cust = g('custom') || [];
    for (const l of cust) { const L = { id: uid(), name: l.name, c: Date.now(), m: [] }; D.lists.push(L); for (const w of l.words || []) addWord(L, w.es, w.en, w.ru); }
    for (const [k, r] of Object.entries(old)) if (D.words[k]) D.words[k].r = r;
  } catch {}
}

/* =================== TEXT =================== */
const lang = () => D.set.lang || 'en';
const L = (en, ru) => lang() === 'ru' ? ru : en;
const plural = (n, one, few, many) => { const a = n % 100, b = n % 10; if (a >= 11 && a <= 14) return many; if (b === 1) return one; if (b >= 2 && b <= 4) return few; return many; };

const spHtml = es => { const a = artKind(es); if (!a || es.split(' ').length < 2) return esc(es); const [f, ...r] = es.split(' '); return `<span class="${a}">${esc(f)}</span> ${esc(r.join(' '))}`; };
const withThe = (es, en) => { const f = es.split(' ')[0].toLowerCase(); return ['el','la','los','las'].includes(f) && es.split(' ').length > 1 && !/^the /i.test(en) ? 'the ' + en : en; };

/* =================== LIBRARY =================== */
const wk = es => clean(es);

}

  if (row.list) row.list.m = row.list.m.filter(x => x.k !== row.k); else D.orphans.splice(D.orphans.indexOf(row.orphan), 1);
  const still = D.lists.some(l => l.m.some(x => x.k === row.k)) || D.orphans.some(o => o.k === row.k);
  if (!still) delete D.words[row.k];
}
function deleteList(list) { for (const m of list.m) D.orphans.push({ k: m.k, ln: list.name, at: m.at || Date.now() }); D.lists.splice(D.lists.indexOf(list), 1); }

  const rows = [];

  for (const o of D.orphans) if (D.words[o.k]) rows.push({ k: o.k, orphan: o, label: o.ln + ' (' + L('deleted', 'удалён') + ')' });
  return rows;
}
const fullyArchived = k => { const refs = D.lists.flatMap(l => l.m.filter(x => x.k === k)); return (refs.length + D.orphans.filter(o => o.k === k).length) > 0 && !refs.some(x => !x.a); };
const nameTaken = (n, except) => D.lists.some(l => l !== except && l.name.trim().toLowerCase() === n.trim().toLowerCase());

/* =================== SCHEDULER =================== */
const MAXR = 10;
const weight = w => Math.pow(0.7, w.r);

const resting = w => !!w.rest && w.rest > Date.now();

}

/* days and time */
const dayKey = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const dayStat = () => D.days[dayKey()] || (D.days[dayKey()] = { s: 0, a: 0, c: 0 });
function formatDuration(sec) { sec = Math.round(sec); if (sec < 60) return sec + (lang() === 'ru' ? ' с' : ' s'); const m = Math.round(sec / 60); if (m < 60) return m + (lang() === 'ru' ? ' мин' : ' min'); return Math.floor(m / 60) + (lang() === 'ru' ? ' ч ' : ' h ') + (m % 60) + (lang() === 'ru' ? ' мин' : ' min'); }
function streak() {
  const studied = new Set(Object.entries(D.days).filter(([, v]) => v.a > 0).map(([k]) => k)); let d = new Date(); if (!studied.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (studied.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); } return n;
}

/* =================== VERBS ENGINE =================== */
const ENDS = { ar:['o','as','a','amos','áis','an'], er:['o','es','e','emos','éis','en'], ir:['o','es','e','imos','ís','en'] };

  if (base.endsWith('guir')) return yo.slice(0, -3) + 'go';

}

const COMPOUND = ['tener','venir','decir','hacer','poner','traer','salir','valer','volver','mover','seguir','sentir','pedir','contar','poder','querer'];

  for (const base of COMPOUND) if (word.endsWith(base) && word !== base) { const p = word.slice(0, -base.length), b = BYINF[base]; if (p.length >= 1 && p.length <= 5 && b) return b.k === 'table' ? { kind: { k: 'table', f: b.f.map(x => x && p + x) }, base } : { kind: { k: b.k }, base }; }

}
function kindLabel(kind, inf, base) {
  if (kind.k === 'regular') { const b = splitRefl(inf)[0]; if (/(cer|cir)$/.test(b)) return 'aeiouáéíóú'.includes(b.slice(0, -3).slice(-1)) ? 'yo -zco' : 'yo -zo'; if (b.endsWith('uir') && !b.endsWith('guir')) return '-uir: y'; return L('regular', 'правильный'); }

}
const usedPersons = it => [0,1,2,3,4,5].filter(p => it.forms[p] != null);
const levelVerbs = n => CATALOG.filter(v => v.l === n);

}
function checkVerb(typed, answer) { const g = normalize(typed), e = normalize(answer); if (!g) return 'wrong'; if (g === e) return 'correct'; if (fold(g) === fold(e)) return 'accent'; return 'wrong'; }
const LEVELS = [
 ['Regular -ar','Правильные на -ar',"Drop -ar, add the ending:\n-o · -as · -a · -amos · -áis · -an","Уберите -ar и добавьте окончание:\n-o · -as · -a · -amos · -áis · -an"],
 ['Regular -er','Правильные на -er',"Drop -er, add the ending:\n-o · -es · -e · -emos · -éis · -en","Уберите -er и добавьте окончание:\n-o · -es · -e · -emos · -éis · -en"],
 ['Regular -ir','Правильные на -ir',"Drop -ir, add the ending:\n-o · -es · -e · -imos · -ís · -en","Уберите -ir и добавьте окончание:\n-o · -es · -e · -imos · -ís · -en"],
 ['ser & estar','ser и estar',"Both mean “to be”. ser: who or what (soy Ana, es alto). estar: where and how (estoy en casa, está cansado).","Оба значат «быть». ser — кто или что (soy Ana, es alto). estar — где и как (estoy en casa, está cansado)."],
 ['e → ie','e → ie',"In yo, tú, él and ellos the e of the stem becomes ie: quiero, quieres. nosotros and vosotros keep e: queremos.","В yo, tú, él и ellos e в основе становится ie: quiero, quieres. В nosotros и vosotros остаётся e: queremos."],
 ['o → ue','o → ue',"In yo, tú, él and ellos the o becomes ue: puedo, puedes. nosotros and vosotros keep o: podemos. jugar: u → ue (juego).","В yo, tú, él и ellos o становится ue: puedo, puedes. В nosotros и vosotros остаётся o: podemos. jugar: u → ue (juego)."],

 ['tener, venir, decir','tener, venir, decir',"-go in yo plus a stem change: tengo, tienes; vengo, vienes; digo, dices.","-go в yo и смена гласной: tengo, tienes; vengo, vienes; digo, dices."],

 ['ir, haber, oír, -uir','ir, haber, oír, -uir',"ir is fully irregular: voy, vas, va… haber here is hay (there is / there are). oír: oigo, oyes. -uir verbs add y: construyo.","ir полностью неправильный: voy, vas, va… haber здесь — hay (есть, имеется). oír: oigo, oyes. Глаголы на -uir добавляют y: construyo."],

];
const lvTitle = n => LEVELS[n - 1][lang() === 'ru' ? 1 : 0], lvRule = n => LEVELS[n - 1][lang() === 'ru' ? 3 : 2];
const lvExamples = n => { const v = levelVerbs(n); return v.slice(0, 3).map(x => x.i).join(', ') + (v.length > 3 ? '…' : ''); };
const vUnlocked = n => n === 1 || D.vpass.includes(n) || D.vpass.includes(n - 1);
const currentLevel = () => { for (let n = 1; n <= 12; n++) if (!D.vpass.includes(n)) return n; return 12; };
const vkey = (inf, p) => inf + '|' + p;
function recordLevel(n, pct) { D.vbest[n] = Math.max(D.vbest[n] || 0, pct); if (pct >= 80 && !D.vpass.includes(n)) D.vpass.push(n); }

const SEPS = ['\t', ' - ', ' – ', ' — ', '=', ';', ','];
function parseWords(text) {

  return out;
}
function parseAny(text) {
  const tx = text.trim();
  try { const j = JSON.parse(tx); if (j && Array.isArray(j.words)) return { name: j.name || '', words: j.words.map(w => ({ es: w.spanish || w.es, en: w.english || w.en, ru: w.english || w.ru || w.en })).filter(w => w.es && w.en) }; } catch {}
  const h = tx.match(/^#\s*(.+)$/m); return { name: h ? h[1].trim() : '', words: parseWords(tx) };
}

function setForm(p, el) { VS.f[p] = el.value.trim() === el.dataset.auto ? '' : el.value.trim(); }
function vinfInput(el) { VS.inf = el.value; refreshPreview(); }
function vinfDone(el) { VS.inf = el.value; const b = BYINF[VS.inf.trim().toLowerCase()]; if (b && !VS.m.trim()) { VS.m = lang() === 'ru' ? b.ru : b.en; const f = $('#vmean'); if (f) f.value = VS.m; } refreshPreview(); }
function drawVerbSheet() {
  const v = VS;
  const types = [['', L('Auto', 'Авто')], ['regular', L('Regular', 'Правильный')], ['e-ie', 'e → ie'], ['o-ue', 'o → ue'], ['e-i', 'e → i'], ['u-ue', 'u → ue'], ['irregular', L('Irregular', 'Неправильный')]];

    <div class="chips">${types.map(([k, lb]) => `<button class="${(v.k || '') === k ? 'on' : ''}" onclick="VS.k=${k ? `'${k}'` : 'null'};drawVerbSheet()">${lb}</button>`).join('')}</div>
    <div id="vprev">${previewHtml()}</div>
    <div class="card row" onclick="VS.also=!VS.also;drawVerbSheet()"><div><b>${L('Also add to a word list', 'Добавить в список слов')}</b><small>${L('for normal word cards', 'для обычных карточек')}</small></div><span class="switch ${v.also ? 'on' : ''}"></span></div>
    ${v.also ? `<select onchange="VS.list=this.value"><option value="">${L('List', 'Список')}…</option>${D.lists.map(l => `<option value="${l.id}" ${v.list === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>` : ''}
    <div class="acts">${v.i >= 0 ? `<button class="bad" onclick="delVerb()">${L('Delete', 'Удалить')}</button>` : ''}<button class="soft" onclick="closeSheet()">${L('Cancel', 'Отмена')}</button>${v.i < 0 ? `<button class="soft" onclick="saveVerb(true)">${L('Save and add another', 'Ещё')}</button>` : ''}<button class="primary" onclick="saveVerb(false)">${L('Save', 'Сохранить')}</button></div>`);
}
function saveVerb(again) {
  const inf = VS.inf.trim().toLowerCase(); if (!isInfinitive(inf)) { toast(L('Type a Spanish infinitive', 'Введите инфинитив')); return; }
  if (VS.i < 0 && D.myverbs.some(x => x.i === inf)) return;
  const meaning = VS.m.trim() || (BYINF[inf] ? (lang() === 'ru' ? BYINF[inf].ru : BYINF[inf].en) : ''), entry = { i: inf, m: meaning, k: VS.k, f: VS.f, c: Date.now() };
  if (VS.i >= 0) D.myverbs[VS.i] = Object.assign(D.myverbs[VS.i], entry); else D.myverbs.push(entry);
  if (VS.also && VS.list) { const l = listById(VS.list); if (l) addWord(l, inf, meaning, meaning); }
  save(); if (again) { VS = { i: -1, inf: '', m: '', k: null, f: Array(6).fill(''), list: VS.list, also: VS.also }; drawVerbSheet(); toast(L('Saved', 'Сохранено')); render(); } else { closeSheet(); render(); }
}
function delVerb() { confirmBox(L('Delete this verb?', 'Удалить глагол?'), VS.inf, L('Delete', 'Удалить'), () => { D.myverbs.splice(VS.i, 1); save(); render(); }); }
let _vsel = null;
SCREENS.vlists = (m, b) => {
  const lists = D.lists.map(l => ({ l, items: listVerbItems([l]) })).filter(x => x.items.length);
  if (!lists.length) { m.innerHTML = `${backLink()}<h1>${L('Verbs from my lists', 'Глаголы из списков')}</h1><div class="center">${art('nolists', 'hero')}<p class="sub">${L('Your lists have no verbs yet. Add verbs like “comer – to eat” to any list.', 'В списках пока нет глаголов. Добавьте «comer – есть» в любой список.')}</p></div>`; return; }
  _vsel = _vsel || new Set(lists.map(x => x.l.id));
  m.innerHTML = `${backLink()}<div class="top"><h1>${L('Choose lists', 'Выберите списки')}</h1><button class="x" style="font-size:16px;font-weight:700" onclick="_vsel=_vsel.size===${lists.length}?new Set():new Set(${JSON.stringify(lists.map(x => x.l.id))});render()">${L('Select all', 'Выбрать все')}</button></div>` +
    lists.map(({ l, items }) => `<div class="card row ${_vsel.has(l.id) ? 'sel' : ''}" onclick="_vsel.has('${l.id}')?_vsel.delete('${l.id}'):_vsel.add('${l.id}');render()"><div><b>${esc(l.name)}</b><small>${counted(items.length, 'verb', 'verbs', 'глагол', 'глагола', 'глаголов')}</small></div><span class="chev">${_vsel.has(l.id) ? '☑' : '☐'}</span></div>`).join('');
  const n = listVerbItems(D.lists.filter(l => _vsel.has(l.id))).length;
  b.innerHTML = `<div class="btnbar"><button class="primary" ${n ? '' : 'disabled'} onclick="startQuiz('lists')">${L('Start', 'Начать')} · ${counted(n, 'verb', 'verbs', 'глагол', 'глагола', 'глаголов')}</button></div>`;
};

/* ---- quiz ---- */
let Q = null, choiceTimer = null;
function startQuiz(src, n) {
  let items, size = src === 'level' ? 20 : (D.set.size || 20), title;
  if (src === 'level') { items = levelVerbs(n).map(catalogItem); title = lvTitle(n); }
  else if (src === 'review') { items = reviewItems(); title = L('Smart review', 'Повторение'); if (!items.length) items = levelVerbs(1).map(catalogItem); }
  else if (src === 'mine') { items = myItems(); title = L('My verbs', 'Мои глаголы'); }
  else { items = listVerbItems(D.lists.filter(l => _vsel && _vsel.has(l.id))); title = L('From my lists', 'Из моих списков'); }
  const cards = buildVerbCards(items, size); if (!cards.length) { toast(L('No verbs to practise', 'Нет глаголов для тренировки')); return; }
  Q = { src, n, title, cards, i: 0, typed: '', res: null, chosen: undefined, out: [], done: false, sec: 0, pend: 0, last: Date.now() };
  clearInterval(tickTimer); tickTimer = setInterval(() => { if (Q && !Q.done && Date.now() - Q.last < 60000) { Q.sec++; Q.pend++; } }, 1000);
  go('vquiz');
}
const QCAP = { conj: () => L('Conjugate', 'Спрягайте'), trans: () => L('Translate', 'Переведите'), choice: () => L('Quick! · 8 s', 'Быстро! · 8 с') };
SCREENS.vquiz = (m, b) => {
  if (!Q) return resetTo('verbs'); if (Q.done) return vquizDone(m, b);
  const c = Q.cards[Q.i], answered = Q.res != null;
  const meP = lang() === 'ru' ? ME_RU[c.p] : ME_EN[c.p];
  let body = '';
  if (c.kind === 'trans') body = `<div class="big">${esc(meP)}</div><div class="en">${esc(c.it.meaning)}</div>`;
  else body = `<div class="big">${esc(c.it.inf)}</div><div class="en">${esc(c.it.meaning)}</div><div style="margin-top:12px;font-size:24px;font-weight:700;color:var(--deep)">${PERSONS_CARD[c.p]}</div>`;
  let fb = '';
  if (answered) { const r = Q.res; fb = `<div class="fb ${r === 'correct' ? 'ok' : isGood(r) ? 'meh' : 'no'}">${r === 'timeout' ? L("Time's up!", 'Время вышло!') : r === 'correct' ? L('Correct', 'Верно') : r === 'accent' ? L('Almost! Check the accent', 'Почти! Проверьте ударение') : L('Not quite', 'Не совсем')}</div>${r !== 'correct' ? `<div class="hintx" style="margin-top:6px"><b style="color:var(--plum);font-size:20px">${esc(c.ans)}</b></div>` : ''}${c.kind !== 'choice' && Q.typed && r === 'wrong' ? `<div class="hintx">${L('You answered ', 'Вы ответили ')}${esc(Q.typed)}</div>` : ''}${r !== 'correct' && r !== 'accent' ? `<div class="hintx">${L('this one comes back soon', 'это слово скоро вернётся')}</div>` : ''}`; }
  m.innerHTML = `<div class="top"><button class="x" onclick="endQuiz()">✕</button><p class="prog">${Q.i + 1} / ${Q.cards.length}</p></div><div class="bar"><i style="width:${Q.i / Q.cards.length * 100}%"></i></div>
    <div class="flash" style="min-height:${c.kind === 'choice' ? 190 : 260}px;height:auto;padding:46px 16px 24px">${art('peek-thinking', 'peek')}<div class="cap">${QCAP[c.kind]()}</div><div>${body}${fb}</div></div>` +
    (c.kind === 'choice' ? `<div class="bar t" style="margin:14px 0"><i id="tbar" style="width:100%"></i></div>` + c.options.map((o, k) => `<button class="optbtn ${answered ? (o === c.ans ? 'right' : (o === Q.chosen ? 'wrong' : '')) : ''}" ${answered ? 'disabled' : ''} onclick="choose(${k})">${esc(o)}</button>`).join('') :
      (answered ? '' : `<input class="f" id="ans" data-sp="1" placeholder="${L('Type in Spanish', 'По-испански')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${specialsHtml()}`));
  if (c.kind === 'choice') {
    if (!answered) { setTimeout(() => { const t = $('#tbar'); if (t) { t.style.transition = 'width 8s linear'; t.style.width = '0%'; } }, 30); choiceTimer = setTimeout(() => { if (Q && !Q.done && Q.res == null) choose(null); }, 8000); }
    b.innerHTML = answered ? `<div class="btnbar"><button class="primary" onclick="vnext()">${L('Next', 'Дальше')}</button></div>` : '';
  } else if (answered) b.innerHTML = `<div class="btnbar"><button class="primary" onclick="vnext()">${L('Next', 'Дальше')}</button></div>`;
  else { b.innerHTML = `<div class="btnbar"><button class="primary" onclick="vcheck()">${L('Check', 'Проверить')}</button></div>`; setTimeout(() => { const a = $('#ans'); if (a) { a.focus(); a.onkeydown = e => e.key === 'Enter' && vcheck(); } }, 0); }
};
function vrecord(c, ok) {
  Q.out.push({ c, ok }); const k = vkey(c.it.inf, c.p), s = D.vstat[k] || (D.vstat[k] = { r: 0, m: 0, t: 0 });
  s.r = ok ? Math.min(MAXR, s.r + 1) : Math.max(0, s.r - 1); if (!ok) s.m++; s.t = Date.now();
  const d = dayStat(); d.a++; if (ok) d.c++; d.s += Q.pend; Q.pend = 0; Q.last = Date.now(); save(); buzz(ok);
}
function vcheck() { const c = Q.cards[Q.i], a = ($('#ans') || {}).value || ''; if (!a.trim()) return; Q.typed = a; Q.res = checkVerb(a, c.ans); vrecord(c, isGood(Q.res)); render(); }
function choose(k) { clearTimeout(choiceTimer); const c = Q.cards[Q.i]; if (Q.res != null) return; Q.chosen = k == null ? null : c.options[k]; const ok = Q.chosen === c.ans; Q.res = k == null ? 'timeout' : ok ? 'correct' : 'wrong'; vrecord(c, ok); render(); }
function vnext() { Q.last = Date.now(); if (Q.i + 1 < Q.cards.length) { Q.i++; Q.typed = ''; Q.res = null; Q.chosen = undefined; render(); } else finishQuiz(); }
function endQuiz() { finishQuiz(); }
function finishQuiz() {
  clearTimeout(choiceTimer); const dd = dayStat(); dd.s += Q.pend; Q.pend = 0;
  const pct = Q.out.length ? Math.round(Q.out.filter(o => o.ok).length / Q.out.length * 100) : 0;

}
function vquizDone(m, b) {

    <p class="sub center">${L(`${correct} of ${Q.out.length} right`, `${correct} из ${Q.out.length} верно`)} · ${Q.sec < 60 ? L('under 1 min', 'меньше минуты') : formatDuration(Q.sec)}</p><p class="sub center rule">${esc(note)}</p>`;

}

/* =================== STATS =================== */
let period = 'week';
SCREENS.stats = (m, b) => {
  const days = Object.entries(D.days), today = D.days[dayKey()] || { s: 0, a: 0, c: 0 };
  const cutoff = period === 'week' ? 7 : period === 'month' ? 30 : 100000, since = new Date(); since.setDate(since.getDate() - cutoff);
  const pd = days.filter(([k]) => period === 'all' || k > dayKey(since)).map(([, v]) => v);
  const secs = pd.reduce((s, v) => s + v.s, 0), ans = pd.reduce((s, v) => s + v.a, 0), cor = pd.reduce((s, v) => s + v.c, 0);
  const st = streak(), words = Object.values(D.words), arch = words.filter(w => fullyArchived(wk(w.es))).length, act = words.filter(w => !fullyArchived(wk(w.es)));
  const strong = act.filter(w => w.r >= 5).length, learning = act.filter(w => w.r >= 1 && w.r <= 4).length, nw = act.length - strong - learning, total = words.length || 1;
  const bars = []; const labels = lang() === 'ru' ? ['В', 'П', 'В', 'С', 'Ч', 'П', 'С'] : ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  if (period === 'all') { const t0 = new Date(); for (let i = 11; i >= 0; i--) { const d = new Date(t0.getFullYear(), t0.getMonth() - i, 1), pre = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); bars.push({ v: days.filter(([k]) => k.startsWith(pre)).reduce((s, [, x]) => s + x.s, 0) / 60, l: '', cur: i === 0 }); } }
  else { const n = period === 'week' ? 7 : 30; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); bars.push({ v: (D.days[dayKey(d)] || { s: 0 }).s / 60, l: period === 'week' ? labels[d.getDay()] : '', cur: i === 0 }); } }
  const top = Math.max(1, ...bars.map(x => x.v));
  m.innerHTML = `<h1>${L('Stats', 'Статистика')}</h1><div class="seg">${[['week', L('Week', 'Неделя')], ['month', L('Month', 'Месяц')], ['all', L('All time', 'Всё время')]].map(([k, lb]) => `<button class="${period === k ? 'on' : ''}" onclick="period='${k}';render()">${lb}</button>`).join('')}</div>
    <div class="tiles"><div class="tile"><span>${L('Today', 'Сегодня')}</span><b>${formatDuration(today.s)}</b>${art('face-happy')}</div><div class="tile"><span>${period === 'week' ? L('Last 7 days', 'За 7 дней') : period === 'month' ? L('Last 30 days', 'За 30 дней') : L('All time', 'Всё время')}</span><b>${formatDuration(secs)}</b>${art('face-wink')}</div>
    <div class="tile"><span>${L('Streak', 'Серия')}</span><b>${counted(st, 'day', 'days', 'день', 'дня', 'дней')}</b>${art('face-cool')}</div><div class="tile"><span>${L('Accuracy', 'Точность')}</span><b>${ans ? Math.round(cor / ans * 100) + '%' : '–'}</b>${art('face-stars')}</div></div>
    <div class="card"><span class="sub" style="font-size:13px">${period === 'all' ? L('Minutes per month', 'Минут в месяц') : L('Minutes per day', 'Минут в день')}</span><div class="chart">${bars.map(x => `<div class="${x.cur ? 'cur' : ''}"><i style="height:${Math.max(3, 80 * x.v / top)}px"></i>${x.l}</div>`).join('')}</div></div>
    <div class="card"><span class="sub" style="font-size:13px">${wordCount(words.length)}</span><div class="segbar"><i style="width:${strong / total * 100}%;background:#698039"></i><i style="width:${learning / total * 100}%;background:#C4D3A0"></i><i style="width:${nw / total * 100}%;background:#fff"></i><i style="width:${arch / total * 100}%;background:#FDFDC9"></i></div>
    <div class="legend"><span>${strong} ${L('strong', 'выучено')}</span><span>${learning} ${L('learning', 'учу')}</span><span>${lang() === 'ru' ? nw + ' ' + plural(nw, 'новое', 'новых', 'новых') : nw + ' new'}</span>${arch ? `<span>${arch} ${L('archived', 'в архиве')}</span>` : ''}</div></div>
    <div class="card row" onclick="backupSheet()"><div><b>${L('Backup', 'Резервная копия')}</b><small>${L('Saved in your Telegram account automatically', 'Автоматически хранится в вашем Telegram')}</small></div><span class="chev">›</span></div>
    <p class="sub" style="margin:14px 0 6px">${L('Look', 'Оформление')}</p><div class="seg"><button class="${(D.set.look || 'tg') === 'tg' ? 'on' : ''}" onclick="D.set.look='tg';save();render()">Telegram</button><button class="${D.set.look === 'memo' ? 'on' : ''}" onclick="D.set.look='memo';save();render()">memo</button></div>
    <p class="sub" style="margin:14px 0 6px">${L('Language', 'Язык')}</p><div class="seg"><button class="${lang() === 'en' ? 'on' : ''}" onclick="D.set.lang='en';save();render()">English</button><button class="${lang() === 'ru' ? 'on' : ''}" onclick="D.set.lang='ru';save();render()">Русский</button></div>`;
};
function backupSheet() {
  const txt = JSON.stringify(D);
  window._bk = txt;
  openSheet(`<h2>${L('Backup', 'Резервная копия')}</h2><p class="hintx">${L('memo saves everything in your Telegram account on its own. To move to another account, copy this text and restore it there.', 'memo сам хранит всё в вашем Telegram. Чтобы перенести в другой аккаунт, скопируйте этот текст и восстановите там.')}</p>
    <textarea id="bkt" style="min-height:120px">${esc(txt)}</textarea><div class="acts"><button class="soft" onclick="$('#bkt').select();try{navigator.clipboard.writeText($('#bkt').value)}catch{document.execCommand('copy')};toast(L('Copied','Скопировано'))">${L('Copy', 'Копировать')}</button><button class="bad" onclick="restoreBackup()">${L('Restore', 'Восстановить')}</button></div><button class="linkbtn" style="color:var(--deep)" onclick="closeSheet()">${L('Cancel', 'Отмена')}</button>`);
}
function restoreBackup() {

}

/* =================== KEYBOARD =================== */
const isField = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== 'file';
document.addEventListener('focusin', e => { if (!isField(e.target)) return; document.body.classList.add('kb'); const t = e.target; [250, 600].forEach(ms => setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch {} }, ms)); });

try { if (tg) tg.onEvent('viewportChanged', () => { const a = document.activeElement; if (isField(a)) setTimeout(() => a.scrollIntoView({ block: 'center' }), 100); }); } catch {}

/* =================== BOOT =================== */
let EXAMPLES = null;
const hadLocal = loadLocal();
Promise.all([fetch('examples.json').then(r => r.json()).catch(() => ({ lists: [] })), fetch('verbs.json').then(r => r.json())]).then(([ex, v]) => {

  loadCloud(() => {

    cleanupExamples();
    save(); render();
  });
});
setInterval(() => { if (typeof flushTime === 'function' && S && !S.done) flushTime(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { flushTime(); persistLocal(); pushCloud(); } catch {} } });
</script></body></html>
